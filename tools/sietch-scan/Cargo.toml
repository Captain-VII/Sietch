[package]
name = "sietch-scan"
version = "0.1.0"
description = "Recherche de la position du joueur pour Sietch (lecture seule, jeu sans BattlEye)"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

# Outil à part : pas dans l'application, pas dans l'installateur.
[workspace]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory"] }

[profile.release]
opt-level = 3
