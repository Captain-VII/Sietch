# Compile Sietch pour Windows à chaque envoi sur main (ou à la demande).
# Le résultat se télécharge dans l'onglet Actions, rubrique « Artifacts » :
# l'installateur (setup.exe et .msi) et l'exécutable seul.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Partagé avec release.yml (qui ne fait que le relire).
          shared-key: sietch-windows

      - name: Dépendances
        run: npm ci

      - name: Types
        run: npx tsc --noEmit -p .

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test

      # Sans paquet de mise à jour : il demande la clé de signature, réservée aux releases (release.yml).
      - name: Compilation
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      - name: Installateurs
        uses: actions/upload-artifact@v5
        with:
          name: Sietch-installateurs-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Exécutable seul
        uses: actions/upload-artifact@v5
        with:
          name: Sietch-exe-${{ github.sha }}
          path: src-tauri/target/release/sietch.exe
          if-no-files-found: error
